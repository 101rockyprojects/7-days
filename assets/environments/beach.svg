<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <!-- Sunset sky gradient -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800"/>
      <stop offset="50%" style="stop-color:#FF5722"/>
      <stop offset="100%" style="stop-color:#E91E63"/>
    </linearGradient>
    <!-- Ocean gradient -->
    <linearGradient id="ocean" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0288D1"/>
      <stop offset="100%" style="stop-color:#01579B"/>
    </linearGradient>
    <!-- Sand gradient -->
    <linearGradient id="sand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5DEB3"/>
      <stop offset="100%" style="stop-color:#DEB887"/>
    </linearGradient>
  </defs>
  
  <!-- Sunset sky -->
  <rect width="400" height="300" fill="url(#sky)"/>
  
  <!-- Sun -->
  <circle cx="300" cy="100" r="35" fill="#FFD54F" opacity="0.9"/>
  
  <!-- Clouds -->
  <ellipse cx="100" cy="60" rx="50" ry="15" fill="#FFCC80" opacity="0.6"/>
  <ellipse cx="250" cy="40" rx="40" ry="12" fill="#FFB74D" opacity="0.5"/>
  
  <!-- Ocean -->
  <rect x="0" y="180" width="400" height="120" fill="url(#ocean)"/>
  
  <!-- Waves -->
  <path d="M0,200 Q50,190 100,200 Q150,210 200,200 Q250,190 300,200 Q350,210 400,200" fill="none" stroke="#4FC3F7" stroke-width="3" opacity="0.6"/>
  <path d="M0,220 Q60,210 120,220 Q180,230 240,220 Q300,210 360,220 Q390,225 400,220" fill="none" stroke="#29B6F6" stroke-width="2" opacity="0.5"/>
  
  <!-- Beach sand -->
  <rect x="0" y="250" width="400" height="50" fill="url(#sand)"/>
  
  <!-- Palm tree -->
  <rect x="50" y="180" width="8" height="70" fill="#5D4037"/>
  <ellipse cx="54" cy="175" rx="40" ry="20" fill="#4CAF50" transform="rotate(-15 54 175)"/>
  <ellipse cx="54" cy="180" rx="35" ry="18" fill="#66BB6A" transform="rotate(10 54 180)"/>
  
  <!-- Seagulls -->
  <path d="M200,80 Q210,70 220,80" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
  <path d="M350,60 Q358,52 366,60" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7"/>
  
  <!-- Shells -->
  <ellipse cx="150" cy="270" rx="6" ry="4" fill="#FFFFFF" opacity="0.6"/>
  <ellipse cx="280" cy="275" rx="5" ry="3" fill="#FFF9C4" opacity="0.5"/>
</svg>
