<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <!-- Interior gradient -->
    <linearGradient id="interior" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A148C"/>
      <stop offset="100%" style="stop-color:#1A0A2E"/>
    </linearGradient>
    <!-- Gold gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#FFA000"/>
    </linearGradient>
  </defs>
  
  <!-- Dark interior -->
  <rect width="400" height="300" fill="url(#interior)"/>
  
  <!-- Arched ceiling -->
  <ellipse cx="200" cy="0" rx="200" ry="100" fill="#2E1065" opacity="0.8"/>
  
  <!-- Columns -->
  <rect x="40" y="50" width="25" height="250" fill="#FFD700" opacity="0.3"/>
  <rect x="335" y="50" width="25" height="250" fill="#FFD700" opacity="0.3"/>
  
  <!-- Column capitals -->
  <rect x="35" y="45" width="35" height="10" fill="#FFA000" opacity="0.5"/>
  <rect x="330" y="45" width="35" height="10" fill="#FFA000" opacity="0.5"/>
  
  <!-- Candelabras -->
  <rect x="95" y="100" width="8" height="150" fill="#FFD700" opacity="0.6"/>
  <circle cx="99" cy="95" r="8" fill="#FF9800" opacity="0.8"/>
  <circle cx="99" cy="95" r="4" fill="#FFEB3B"/>
  
  <rect x="295" y="120" width="8" height="130" fill="#FFD700" opacity="0.6"/>
  <circle cx="299" cy="115" r="8" fill="#FF9800" opacity="0.8"/>
  <circle cx="299" cy="115" r="4" fill="#FFEB3B"/>
  
  <!-- Curtains -->
  <path d="M0,50 Q50,100 0,150" fill="#B71C1C" opacity="0.7"/>
  <path d="M400,50 Q350,100 400,150" fill="#B71C1C" opacity="0.7"/>
  
  <!-- Floating petals -->
  <ellipse cx="150" cy="180" rx="4" ry="2" fill="#E91E63" opacity="0.6" transform="rotate(30 150 180)"/>
  <ellipse cx="250" cy="200" rx="3" ry="1.5" fill="#F48FB1" opacity="0.7" transform="rotate(-20 250 200)"/>
  <ellipse cx="200" cy="150" rx="5" ry="2.5" fill="#E91E63" opacity="0.5" transform="rotate(45 200 150)"/>
</svg>
