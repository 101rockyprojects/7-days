<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB"/>
      <stop offset="100%" style="stop-color:#E0F7FA"/>
    </linearGradient>
    <!-- Grass gradient -->
    <linearGradient id="grass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#81C784"/>
      <stop offset="100%" style="stop-color:#4CAF50"/>
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="400" height="300" fill="url(#sky)"/>
  
  <!-- Distant hills -->
  <ellipse cx="200" cy="220" rx="250" ry="60" fill="#A5D6A7" opacity="0.6"/>
  <ellipse cx="100" cy="230" rx="150" ry="40" fill="#C8E6C9" opacity="0.5"/>
  
  <!-- Grass field -->
  <rect x="0" y="200" width="400" height="100" fill="url(#grass)"/>
  
  <!-- Flowers -->
  <circle cx="50" cy="240" r="4" fill="#FFEB3B"/>
  <circle cx="120" cy="250" r="3" fill="#E91E63"/>
  <circle cx="200" cy="235" r="5" fill="#FF9800"/>
  <circle cx="280" cy="245" r="4" fill="#9C27B0"/>
  <circle cx="350" cy="240" r="3" fill="#FFEB3B"/>
  
  <!-- Sun -->
  <circle cx="350" cy="50" r="30" fill="#FFD54F" opacity="0.9"/>
</svg>
