<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D47A1"/>
      <stop offset="50%" style="stop-color:#1565C0"/>
      <stop offset="100%" style="stop-color:#42A5F5"/>
    </linearGradient>
    <!-- Sunset horizon -->
    <linearGradient id="horizon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#FF5722;stop-opacity:0.3"/>
    </linearGradient>
  </defs>
  
  <!-- Deep sky -->
  <rect width="400" height="300" fill="url(#sky)"/>
  
  <!-- Sunset horizon -->
  <rect x="0" y="200" width="400" height="100" fill="url(#horizon)"/>
  
  <!-- Stars -->
  <circle cx="50" cy="30" r="1.5" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="120" cy="50" r="1" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="200" cy="20" r="2" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="280" cy="45" r="1.5" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="350" cy="35" r="1" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="80" cy="80" r="1" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="320" cy="70" r="1.5" fill="#FFFFFF" opacity="0.6"/>
  
  <!-- Clouds -->
  <ellipse cx="100" cy="120" rx="60" ry="20" fill="#FFFFFF" opacity="0.2"/>
  <ellipse cx="300" cy="100" rx="50" ry="18" fill="#FFFFFF" opacity="0.15"/>
  <ellipse cx="200" cy="150" rx="70" ry="22" fill="#FFFFFF" opacity="0.1"/>
  
  <!-- Sun/Moon -->
  <circle cx="200" cy="180" r="25" fill="#FFD54F" opacity="0.8"/>
  
  <!-- Birds -->
  <path d="M150,90 Q158,80 166,90" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
  <path d="M250,70 Q256,62 262,70" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Floating lanterns -->
  <rect x="80" y="180" width="12" height="16" rx="2" fill="#FF9800" opacity="0.7"/>
  <ellipse cx="86" cy="178" rx="4" ry="3" fill="#FFEB3B" opacity="0.8"/>
  
  <rect x="300" y="200" width="10" height="14" rx="2" fill="#FF9800" opacity="0.6"/>
  <ellipse cx="305" cy="198" rx="3.5" ry="2.5" fill="#FFEB3B" opacity="0.7"/>
  
  <rect x="180" y="160" width="8" height="12" rx="1.5" fill="#FF9800" opacity="0.5"/>
  <ellipse cx="184" cy="158" rx="3" ry="2" fill="#FFEB3B" opacity="0.6"/>
</svg>
