<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <!-- Misty light gradient -->
    <linearGradient id="mist" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1B5E20"/>
      <stop offset="50%" style="stop-color:#2E7D32"/>
      <stop offset="100%" style="stop-color:#388E3C"/>
    </linearGradient>
    <!-- Light rays -->
    <linearGradient id="rays" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <!-- Dark forest background -->
  <rect width="400" height="300" fill="url(#mist)"/>
  
  <!-- Light rays through canopy -->
  <polygon points="150,0 200,300 100,300" fill="url(#rays)" opacity="0.4"/>
  <polygon points="250,0 280,300 220,300" fill="url(#rays)" opacity="0.3"/>
  
  <!-- Tree trunks -->
  <rect x="30" y="50" width="15" height="250" fill="#3E2723"/>
  <rect x="100" y="30" width="20" height="270" fill="#4E342E"/>
  <rect x="280" y="40" width="18" height="260" fill="#3E2723"/>
  <rect x="350" y="60" width="16" height="240" fill="#4E342E"/>
  
  <!-- Canopy leaves -->
  <ellipse cx="50" cy="40" rx="60" ry="30" fill="#1B5E20"/>
  <ellipse cx="120" cy="20" rx="70" ry="35" fill="#2E7D32"/>
  <ellipse cx="300" cy="30" rx="65" ry="32" fill="#1B5E20"/>
  <ellipse cx="370" cy="50" rx="55" ry="28" fill="#2E7D32"/>
  
  <!-- Ferns -->
  <ellipse cx="80" cy="280" rx="40" ry="15" fill="#4CAF50" opacity="0.7"/>
  <ellipse cx="320" cy="275" rx="35" ry="12" fill="#66BB6A" opacity="0.6"/>
  
  <!-- Fireflies -->
  <circle cx="150" cy="150" r="3" fill="#FFEB3B" opacity="0.8"/>
  <circle cx="250" cy="180" r="2" fill="#FFEB3B" opacity="0.7"/>
  <circle cx="180" cy="200" r="2.5" fill="#FFEB3B" opacity="0.9"/>
</svg>
